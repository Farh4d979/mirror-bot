name: Telegram Mirror Bot

# On-demand fallback only. The normal runtime is the PC (see
# deploy/windows-pc.md). The PC starts this workflow when it hands over and
# cancels any active run when it takes the bot back. There is deliberately no
# schedule and no self-queue: a run stops after its time limit instead of
# keeping GitHub Actions busy forever.

on:
  workflow_dispatch:
    inputs:
      run_seconds:
        description: "Run for N seconds (blank = 17100)"
        required: false
        default: ""
      offset:
        description: "Last Telegram update offset (optional)"
        required: false
        default: ""
      handoff:
        description: "Started by the local PC runner"
        type: boolean
        default: false

run-name: "Telegram Mirror Bot (${{ github.event.inputs.handoff == 'true' && 'PC handoff' || 'manual' }})"

concurrency:
  group: telegram-mirror-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    env:
      PYTHONUNBUFFERED: "1"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
      GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
      PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
      GOFILE_WT_SALT: ${{ vars.GOFILE_WT_SALT || '12af056dacea0b' }}
      MAX_FILE_SIZE: ${{ vars.MAX_FILE_SIZE || '0' }}
      MAX_CONCURRENT_JOBS: ${{ vars.MAX_CONCURRENT_JOBS || '1' }}
      MULTI_FILE_MODE: ${{ vars.MULTI_FILE_MODE || 'largest' }}
      JOB_TIMEOUT: ${{ vars.JOB_TIMEOUT || '7200' }}
      YTDLP_FORMAT: ${{ vars.YTDLP_FORMAT || 'bv*+ba/b' }}
      BOT_RUN_SECONDS: ${{ github.event.inputs.run_seconds || '17100' }}
      STATE_FILE: .state/telegram.json
      LOG_LEVEL: INFO

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Telegram offset from the PC
        if: github.event.inputs.offset != ''
        env:
          OFFSET: ${{ github.event.inputs.offset }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ["OFFSET"].strip()
          if not raw.isdigit():
              raise SystemExit("offset must be a non-negative integer")

          path = Path(".state/telegram.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          current = 0
          if path.exists():
              try:
                  current = int(json.loads(path.read_text()).get("last_update_id", 0))
              except (OSError, ValueError, TypeError):
                  current = 0
          path.write_text(
              json.dumps({"last_update_id": max(current, int(raw))}, indent=2) + "\n"
          )
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install system tools
        timeout-minutes: 4
        run: |
          APT_OPTS="-o Acquire::ForceIPv4=true -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 -o Acquire::Retries=0 -o DPkg::Lock::Timeout=15"
          missing=""
          if ! command -v 7z >/dev/null 2>&1 && ! command -v 7zz >/dev/null 2>&1; then
            missing="$missing 7zip"
          fi
          SOURCE="$(python - <<'PY' 2>/dev/null || true
          import json, os
          from cryptography.fernet import Fernet
          raw = os.environ.get("REMOTE_PAYLOAD", "")
          if raw:
              data = json.loads(Fernet(os.environ["REMOTE_JOB_KEY"].encode()).decrypt(raw.encode()))
              print(data.get("source", ""))
          PY
          )"
          NEED_FFMPEG=1
          case "${SOURCE%%\?*}" in
            *.zip|*.7z|*.rar|*.tar|*.gz|*.xz|*.bz2|*.img|*.bin|*.iso|*.apk|*.exe|*.msi|*.dmg|*.mp4|*.mkv|*.webm|*.mp3|*.flac|*.pdf|*.epub)
              NEED_FFMPEG=0
              ;;
          esac
          if [ "$NEED_FFMPEG" = 1 ] && ! command -v ffmpeg >/dev/null 2>&1; then
            missing="$missing ffmpeg"
          fi
          case "$SOURCE" in
            *mega.nz*|*mega.co.nz*|*mega.io*) missing="$missing megatools" ;;
          esac
          if [ -n "$missing" ]; then
            # The runner image already ships 7-Zip, aria2 and xz. Keep any apt
            # attempt short so a stalled mirror cannot block the mirror job.
            timeout -k 5 25 sudo apt-get update -qq $APT_OPTS || true
            timeout -k 5 60 sudo apt-get install -y -qq $APT_OPTS $missing \
              || echo "::warning::apt could not install:$missing"
          fi
          if [ "$NEED_FFMPEG" = 1 ] && ! command -v ffmpeg >/dev/null 2>&1; then
            # PyPI is a reliable fallback when the distro mirror is slow.
            if timeout -k 5 90 python -m pip install -q --disable-pip-version-check --no-deps imageio-ffmpeg; then
              FFMPEG_BIN="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
              sudo install -m 0755 "$FFMPEG_BIN" /usr/local/bin/ffmpeg
            else
              echo "::warning::ffmpeg is unavailable; yt-dlp will fall back to a single format."
            fi
          fi
          command -v 7z || command -v 7zz || { echo "::error::7-Zip is required but was not found."; exit 1; }

      - name: Install payload-dumper-go
        run: |
          set -euo pipefail
          curl --connect-timeout 15 --max-time 180 -fsSL \
            -o "$RUNNER_TEMP/payload-dumper-go.tar.gz" \
            https://github.com/ssut/payload-dumper-go/releases/download/2.1.0/payload-dumper-go_2.1.0_linux_amd64.tar.gz
          sudo tar -xzf "$RUNNER_TEMP/payload-dumper-go.tar.gz" \
            -C /usr/local/bin payload-dumper-go
          sudo chmod +x /usr/local/bin/payload-dumper-go
          command -v payload-dumper-go

      - name: Show runner disk
        run: df -h /

      - name: Run bot
        id: bot
        env:
          DOWNLOAD_DIR: ${{ runner.temp }}/mirror-downloads
        run: python -m bot

      - name: Persist Telegram update offset
        id: persist
        if: always()
        run: |
          set -e
          BRANCH="${{ github.ref_name }}"

          # Keep the bot's offset if this run received updates.
          STATE_BACKUP=""
          if [ -f .state/telegram.json ]; then
            STATE_BACKUP="$(mktemp)"
            cp .state/telegram.json "$STATE_BACKUP"
          fi

          git checkout -B "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Always put the tiny state commit on top of the current remote branch.
          # The runner is ephemeral, so discarding local changes is safe here.
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            mkdir -p .state

            if [ -n "$STATE_BACKUP" ]; then
              cp "$STATE_BACKUP" .state/telegram.json
              git add -f .state/telegram.json
            fi

            if git diff --cached --quiet; then
              echo "Nothing to persist."
              exit 0
            fi

            git commit -m "chore: update bot state [skip ci]"

            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            sleep 5
          done
          echo "Could not push the state file." >&2
          exit 1

      - name: Clean downloads
        if: always()
        run: rm -rf "${{ runner.temp }}/mirror-downloads"
