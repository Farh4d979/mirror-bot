name: Mirror Job Worker

# One-shot worker started by the Telegram controller (PC or Cloudflare Worker)
# for a single mirror/dump job. GitHub only sees an encrypted payload. The
# worker edits the Telegram message created by the controller and posts the
# final link itself.

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Encrypted job payload (created by the Telegram controller)"
        required: true
      job_id:
        description: "Random job id from the Telegram controller"
        required: true

run-name: "Mirror job ${{ github.event.inputs.job_id }}"

concurrency:
  group: mirror-job-${{ github.event.inputs.job_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      PYTHONUNBUFFERED: "1"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      REMOTE_JOB_KEY: ${{ secrets.REMOTE_JOB_KEY }}
      GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
      PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
      REMOTE_PAYLOAD: ${{ github.event.inputs.payload }}
      REMOTE_JOB_ID: ${{ github.event.inputs.job_id }}
      GOFILE_WT_SALT: ${{ vars.GOFILE_WT_SALT || '12af056dacea0b' }}
      LOG_LEVEL: INFO

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system tools
        timeout-minutes: 6
        run: |
          APT_OPTS="-o Acquire::ForceIPv4=true -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1"
          timeout 90 sudo apt-get update -qq $APT_OPTS \
            || echo "apt-get update did not finish; using the runner's package lists"
          sudo apt-get install -y -qq $APT_OPTS aria2 ffmpeg megatools xz-utils 7zip 7zip-rar \
            || sudo apt-get install -y -qq $APT_OPTS aria2 ffmpeg megatools xz-utils 7zip \
            || sudo apt-get install -y -qq $APT_OPTS aria2 ffmpeg megatools xz-utils p7zip-full p7zip-rar
          command -v 7z || command -v 7zz

      - name: Install payload-dumper-go
        run: |
          set -euo pipefail
          curl --connect-timeout 15 --max-time 180 -fsSL \
            -o "$RUNNER_TEMP/payload-dumper-go.tar.gz" \
            https://github.com/ssut/payload-dumper-go/releases/download/2.1.0/payload-dumper-go_2.1.0_linux_amd64.tar.gz
          sudo tar -xzf "$RUNNER_TEMP/payload-dumper-go.tar.gz" \
            -C /usr/local/bin payload-dumper-go
          sudo chmod +x /usr/local/bin/payload-dumper-go
          command -v payload-dumper-go

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Show runner disk
        run: df -h /

      - name: Run mirror job
        env:
          DOWNLOAD_DIR: ${{ runner.temp }}/mirror-downloads
        run: python -m mirror.worker

      - name: Clean downloads
        if: always()
        run: rm -rf "${{ runner.temp }}/mirror-downloads"
